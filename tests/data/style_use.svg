<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="120" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet">
  <style>
    .a { fill: #e33; stroke: #300; stroke-width: 4 }
    .b { fill: #3a3; opacity: 0.7 }
    #c { fill: hsl(220, 80%, 50%) }
    rect.d { fill: rgba(250, 160, 0, 0.8); }
  </style>
  <defs>
    <path id="tri" d="M 0 0 L 50 0 L 25 -45 Z"/>
    <g id="pair">
      <circle cx="20" cy="20" r="18" class="b"/>
      <circle cx="40" cy="20" r="18" fill="#33e" fill-opacity="0.5"/>
    </g>
  </defs>
  <rect class="a" x="20" y="20" width="100" height="80"/>
  <circle id="c" cx="190" cy="60" r="40"/>
  <rect class="d" x="250" y="20" width="120" height="80" rx="20"/>
  <use xlink:href="#tri" x="40" y="200" class="a"/>
  <use xlink:href="#tri" x="130" y="200" fill="purple" transform="scale(1.5)"/>
  <use xlink:href="#pair" x="220" y="130"/>
  <use xlink:href="#pair" x="300" y="150" transform="rotate(15)"/>
  <rect x="5" y="5" width="390" height="230" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 3"/>
</svg>
